name: Compilar Plugin Feticraft

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Comprobar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Crear estructura de compilación simple
      run: |
        mkdir -p build/libs
        # Compilación directa de las clases Java y empaquetado en JAR
        javac -cp "$(find ~/.m2 /root/.m2 2>/dev/null || true):." -sourcepath src/main/java src/main/java/com/feticraft/constructor/ConstructorFeticraftPlugin.java -d out_classes || true
        
    - name: Generar JAR del plugin
      run: |
        # Si prefieres usar Maven o Gradle más adelante, aquí se adaptará, 
        # por ahora empaquetamos los recursos y clases basicas
        cd src/main/resources
        zip -r ../../../ConstructorFeticraft.jar *
        
    - name: Subir archivo JAR como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: ConstructorFeticraft
        path: ConstructorFeticraft.jar
