# Catálogo de construcciones de Constructor de Feticraft
# Cada diseño apunta a un archivo .schem dentro de la carpeta plugins/ConstructorFeticraft/diseños/

categorias:
  casas_pequenas:
    nombre: "&aCasas Pequeñas"
    icono: "OAK_DOOR"
    descripcion: "Hogares acogedores y económicos ideales para empezar."

  granjas:
    nombre: "&eGranjas y Cultivos"
    icono: "WHEAT"
    descripcion: "Estructuras agrícolas para producción de recursos."

disenos:
  choza_madera:
    nombre: "&6Choza de Madera Básica"
    categoria: "casas_pequenas"
    descripcion: "Una pequeña cabaña de roble con espacio para cama, horno y cofres."
    precio: 25000.0
    dimensiones:
      ancho: 7
      largo: 7
      alto: 6
    etiquetas:
      - "madera"
      - "medieval"
      - "pequeña"
    esquema: "casas/choza_madera.schem"

  granja_automatizada:
    nombre: "&eGranja de Trigo Estándar"
    categoria: "granjas"
    descripcion: "Terreno delimitado con vallas, iluminación y zona de cultivo con agua."
    precio: 35000.0
    dimensiones:
      ancho: 9
      largo: 9
      alto: 4
    etiquetas:
      - "granja"
      - "exterior"
      - "cultivos"
    esquema: "granjas/granja_trigo.schem"
